name: Deploy {{SERVICE_NAME}} to {{ENVIRONMENT_NAME}}

on:
  push:
    branches:
      - {{BRANCH}}
{{FOLDER_PATH_FILTER}}
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: {{AWS_REGION}}
  ECR_REPOSITORY: {{ECR_REPOSITORY}}
  SERVICE_NAME: {{SERVICE_NAME}}
  ENVIRONMENT: {{ENVIRONMENT}}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
{{GITHUB_ENVIRONMENT}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: {{AWS_ROLE_ARN}}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: Devlift-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.SERVICE_NAME }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '{{GO_VERSION}}'

      - name: Download dependencies
        run: go mod download

      - name: Build Go binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o app {{BUILD_PATH}}

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build {{DOCKERFILE_FLAG}}\
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REPOSITORY }}:latest \
{{GO_DOCKER_BUILD_ARGS}}{{CUSTOM_BUILD_ARGS}}            .
          docker push ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REPOSITORY }}:latest
          echo "image=${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name {{EKS_CLUSTER_NAME}}

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/${{ env.SERVICE_NAME }} --namespace=${{ env.SERVICE_NAME }}
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} --namespace=${{ env.SERVICE_NAME }} --timeout=5m

      - name: Verify deployment
        run: |
          echo "Checking pod status..."
          kubectl get pods --namespace=${{ env.SERVICE_NAME }}

          echo "Waiting for ALB to provision..."
          for i in {1..30}; do
            ALB_URL=$(kubectl get ingress ${{ env.SERVICE_NAME }}-ingress --namespace=${{ env.SERVICE_NAME }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$ALB_URL" ]; then
              echo "ALB provisioned successfully!"
              echo "ALB URL: http://$ALB_URL"
              exit 0
            fi
            echo "Waiting for ALB... ($i/30)"
            sleep 10
          done

          echo "ALB provisioning timeout. Check ingress status:"
          kubectl describe ingress ${{ env.SERVICE_NAME }}-ingress --namespace=${{ env.SERVICE_NAME }}
